name: FastAPI ML CI pipeline 

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main 

  workflow_dispatch:

jobs:
  fastapi-mi-ci:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout repository 
        uses: actions/checkout@v4 

      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt 

      - name: Run ruff
        run: python -m ruff check .

      - name: Run pytest 
        run: mkdir -p reports python -m pytest -v --html=reports/report.html --self-contained-html 

      # Upload report 
      - name: Upload test report 
        if: always()
        uses: actions/upload-artifact@v4 
        with:
          name: pytest-report 
          path: reports/report.html 
          if-no-files-found: warn                      
            
