name: Runner Environment

on: 
  push:
    branches:
      - main 

  pull_request:
    branches:
      - main 

  workflow_dispatch:

jobs:
  runner-info:
    runs-on: ubuntu-latest 

    steps:
      - name: Check operating system
        run: uname -a

      - name: Check ubuntu version
        run: lsb_release -a  

      - name: Check python version 
        run: python --version 

      - name: Check current directory
        run: pwd

      - name: List available files
        run: ls -la      
            
